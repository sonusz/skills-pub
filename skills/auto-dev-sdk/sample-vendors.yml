# sample-vendors.yml — every vendor the auto-dev-sdk harness can use, in every
# role. Tracked by git; the harness never reads this file directly.
#
# The harness reads `vendors.yml` (machine-local, git-ignored) from the SDK
# root, or the file named by `--vendors-yml` / `AUTODEV_VENDORS_YML`. Create
# it from this sample, keeping only the vendors that work on this machine:
#
#   python3 shared/vendors/scripts/init-vendors.py \
#     --sample skills/auto-dev-sdk/sample-vendors.yml \
#     --out    skills/auto-dev-sdk/vendors.yml
#
# The generator removes panel reviewers whose CLI is not installed and clamps
# `min_responding_reviewers`; it only warns about `stages`, `synthesizer`, and
# `probe` because a coding stage needs a vendor — edit those by hand. Vendor
# ids, CLI binaries, and known model ids are catalogued in
# shared/vendors/sample-vendors.yaml.
#
# Required: `stages` mapping with every coding stage below.
# Allowed coding vendors: claude, codex, openai, cursor, grok. Agy is
# panel-review-only. Vendor labels are case-insensitive and normalized to
# lowercase. `codex` and `openai` both route through the Codex CLI.
# `probe_interval_sec` (per stage) is the idle threshold for the probe LLM:
# when the vendor's stream output file has been silent for this many seconds,
# the harness consults the idle probe to decide extend vs kill. The hard
# wall-clock backstop is derived in subprocess_runner as a generous multiple
# of this value.
# `effort` uses the shared scale min|low|medium|high|xhigh|max; shared/vendors
# maps it to the nearest supported native effort for the selected vendor.
# `flags` is optional and restricted by autodev/vendors/allowlist.py.
# Harness-owned write/approval scope controls such as yolo, tool allowlists,
# and extra write directories are intentionally not configurable here.
# All LLM calls route through the packaged shared/vendors module and its
# `<id>/out`, `<id>/status`, `<id>/log` contract.
#
# QUOTA GATE + FALLBACKS (optional; any role: stages, panel reviewers,
# synthesizer, probe):
#   min_quota_pct: minimum *remaining* quota % required to run this LLM. Before
#     each call the harness reads the vendor's remaining quota. Claude, Codex,
#     Cursor, Agy, and Grok are supported. Agy reads its prompt-free loopback
#     quota summary; Grok reads ACP billing, so neither probe consumes model
#     quota. If remaining < min_quota_pct, the next fallback is tried.
#     Omit = ungated.
#   fallbacks: ordered alternates, each a full LLM (vendor/model/effort) with its
#     own min_quota_pct. The first with enough quota is used. If NONE qualify the
#     run pauses (GATE_PENDING) and records the earliest recovery time + a repo
#     fingerprint; `autodev quota-resume <feature>` then auto-continues only if
#     still paused, time reached, quota recovered, and the repo is unchanged.
#   Fail-closed: a vendor whose quota can't be read counts as insufficient.
#   Constraints: stage/probe fallback vendors ∈ the role's allowed set; reviewer
#     fallbacks must use a different underlying provider than their primary;
#     synthesizer fallbacks must be schema-capable (claude/codex/openai/grok).
#     All probes fail closed when credentials, endpoints, or parseable quota are
#     unavailable.
#   Example (uncomment under a stage):
#     min_quota_pct: 20
#     fallbacks:
#       - vendor: codex
#         model: gpt-6-astra
#         effort: high
#         min_quota_pct: 15

stages:
  # Produces the design packet from PRD and repo context.
  # Context: largest stage; reads PRD, repo structure, prior completed specs,
  # and panel feedback during rework. Effort: high.
  design:
    vendor: claude
    model: fable
    probe_interval_sec: 2400
    effort: high

  # Implements the accepted design and writes target artifacts/code.
  # Context: large and repo-heavy; needs enough room for design packet,
  # current source, failures, and test output. Effort: high.
  build:
    vendor: claude
    model: opus
    probe_interval_sec: 3600
    effort: medium

  # Ralph close/review pass over implementation/spec/checklist.
  # Context: medium; checks consistency and release readiness, not broad design
  # exploration. Effort: medium-high.
  review:
    vendor: codex
    model: gpt-5.6-terra
    probe_interval_sec: 900
    effort: high

  # Builds implementation evidence/spec after code exists.
  # Context: medium; mostly accepted design, implementation index, and changed
  # files. Effort: medium-high.
  spec:
    vendor: claude
    model: sonnet
    probe_interval_sec: 900
    effort: medium

panel:
  # A panel may synthesize after this many independent reviewers respond when
  # every omitted reviewer has failed a real retry and quota is then confirmed
  # exhausted. Non-quota transport failures still block. init-vendors.py clamps
  # this to the number of reviewers kept.
  min_responding_reviewers: 2
  # Independent design/close-gate reviewers. Each sees the primary artifact and
  # consulted docs, then returns findings; they should not generate new design.
  # Diversity is enforced on the underlying provider, so keep at least two
  # different providers. Context: medium-large. Effort: high.
  reviewers:
    # Claude: strong natural-language critique and ambiguity detection.
    - vendor: claude
      model: opus
      effort: medium
    # Grok: independent xAI-backed reviewer for divergence signal.
    - vendor: grok
      model: grok-4.5
      effort: max
    # Agy/Gemini: independent reviewer through the Antigravity CLI.
    - vendor: agy
      model: gemini-3.1-pro-high
      effort: max
    # Codex: code-aware reviewer, useful for implementation/design feasibility.
    - vendor: codex
      model: gpt-6-astra
      effort: medium
    # Cursor: proxies a backing provider (here Gemini) under Cursor's own auth;
    # effort is encoded in the model SKU, `effort` is informational.
    - vendor: cursor
      model: gemini-3.1-pro
      effort: medium
  # Preserves reviewer findings and performs semantic issue clustering.
  # This identity work controls rerun sizing and recurrence, so use the
  # strongest configured reasoning model rather than the extraction model.
  # Must be schema-capable: claude, codex/openai, or grok.
  synthesizer:
    vendor: claude
    model: opus
    effort: medium
  reviewer_probe_interval_sec: 600
  synthesizer_probe_interval_sec: 300

# Short idle-timeout arbiter. It reads process tree and log tails, then says
# extend or kill; it never develops artifacts. Context: small. Effort: low.
# Allowed: claude, codex/openai, grok.
probe:
  vendor: claude
  model: claude-haiku-4-5
  timeout_sec: 60
  effort: low
