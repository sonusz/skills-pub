# Five vendor calls made by panel-review.
#
# The four entries under `panel` receive the same manifest-only review prompt
# in parallel and read reviewed files from the configured audit root.
# The `synthesis` entry receives that prompt plus panel outputs and produces
# the final comparative report.
# Effort uses the shared vendor scale: min, low, medium, high, xhigh, max.

panel:
  - id: openai
    vendor: openai
    effort: max
    model: gpt-6-astra
  - id: claude
    vendor: claude
    effort: max
    model: opus
  - id: agy
    vendor: agy
    effort: max
    model: gemini-3.1-pro-high
  - id: grok
    vendor: grok
    effort: max
    model: grok-4.5

synthesis:
  id: synthesis
  vendor: claude
  effort: high
  model: claude-sonnet-5
