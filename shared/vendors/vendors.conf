# Default model choices for scripts/call.sh.
#
# Keys are <vendor>.model=<model-id>.
# Model names are not validated here; they are passed to each vendor CLI.

openai.model=gpt-5.4

claude.model=claude-sonnet-4-6

gemini.model=gemini-3-flash

# Cursor encodes effort, thinking, speed, and context tier directly in the
# model id (e.g. `-medium`, `-thinking`, `-fast`, `-1M`); the wrapper's
# `--effort` flag has no Cursor analog. List current ids with
# `cursor-agent --list-models` and pin the chosen SKU here.
cursor.model=claude-4.6-sonnet-medium
